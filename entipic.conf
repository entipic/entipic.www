# Shared response cache for the image CDN.
# Included from nginx's http{} block.
#
# nginx creates /var/cache/nginx/entipic-cdn itself on start, but with a single
# mkdir() -- if /var/cache/nginx does not exist, create it first.
proxy_cache_path /var/cache/nginx/entipic-cdn
                 levels=1:2
                 keys_zone=entipic_cdn:32m
                 max_size=8g
                 inactive=30d
                 use_temp_path=off;

# The apps run on a separate host, so every un-pooled request pays a full
# cross-network TCP handshake. `proxy_set_header Connection ""` alone does not
# pool anything -- that needs an upstream block with `keepalive`.
upstream entipic_cdn_app {
  server 172.26.13.139:41527;
  keepalive 64;
  keepalive_timeout 60s;
}

upstream entipic_web_app {
  server 172.26.13.139:41528;
  keepalive 32;
  keepalive_timeout 60s;
}

# ---------------------------------------------------------------------------
# cdn.entipic.com - image delivery
#
# Serves plain http on :80 *and* https on :443, deliberately without a
# redirect between them: entipic.url still emits http:// links, and redirecting
# would add a round trip to every one of them. https gets HTTP/2, which lifts
# the browser's ~6-connections-per-host cap on image-heavy pages.
# ---------------------------------------------------------------------------
server {
  location / {
    proxy_cache entipic_cdn;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 10m;
    proxy_cache_valid any 1m;

    # One request populates the cache; the rest wait rather than all stampede
    # through to S3.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;

    # Keep serving during an origin blip, and refresh expired entries in the
    # background so no user pays the revalidation latency.
    proxy_cache_use_stale error timeout updating
                          http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    # Forward If-None-Match upstream so the app can answer 304 cheaply.
    proxy_cache_revalidate on;

    add_header X-Cache-Status $upstream_cache_status always;

    proxy_redirect  off;
    proxy_set_header  X-Real-IP  $remote_addr;
    proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto  $scheme;
    proxy_set_header  Host $http_host;
    proxy_set_header  X-NginX-Proxy true;
    proxy_set_header  Connection "";
    proxy_http_version  1.1;

    proxy_connect_timeout 2s;
    proxy_read_timeout    10s;

    proxy_pass  http://entipic_cdn_app;
  }

  listen 80;

  # Same certificate as entipic.com -- cdn.entipic.com is one of its SANs.
  # `ipv6only=on` is a socket-level option and is declared once, on the
  # entipic.com block below; repeating it here would be a config error.
  # This nginx predates 1.25.1, so HTTP/2 goes in the listen line rather than
  # the standalone `http2 on;` directive.
  listen [::]:443 ssl http2;
  listen 443 ssl http2;
  ssl_certificate /etc/letsencrypt/live/entipic.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/entipic.com/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

  # JPEG and WebP are already compressed; gzip only burns CPU on them.
  gzip off;

  server_name cdn.entipic.com;
}

server {
  if ($http_host != "www.entipic.com") {
    return 301 https://www.entipic.com$request_uri;
  }

  location / {
    proxy_redirect  off;
    proxy_set_header  X-Real-IP  $remote_addr;
    proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto  $scheme;
    proxy_set_header  Host $http_host;
    proxy_set_header  X-NginX-Proxy true;
    proxy_set_header  Connection "";
    proxy_http_version  1.1;
    proxy_pass  http://entipic_web_app;
  }

  # `default_server` is explicit now that cdn.entipic.com also listens on :443.
  # Without it the cdn block above, being first in the file, would silently
  # become the fallback for unrecognised SNI names.
  listen [::]:443 ssl http2 ipv6only=on default_server; # managed by Certbot
  listen 443 ssl http2 default_server; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/entipic.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/entipic.com/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml image/svg+xml;

  server_name entipic.com www.entipic.com;
}

server {
  listen 80;
  server_name entipic.com www.entipic.com;
  return 301 https://$host$request_uri;
}
